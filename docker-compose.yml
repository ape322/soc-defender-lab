---
services:
  vulnerable-backend:
    image: hashicorp/http-echo
    command: ["-listen=:8080", "-text", "Backend is alive"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  active-sentry:
    container_name: active-sentry
    network_mode: host
    env_file: .env
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/log:/var/log
    build: .
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    network_mode: host
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yml:/etc/promtail/config.yml
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
